version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ['org.springframework.boot:*', 'org.springframework.modulith:*', 'org.springdoc:*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /ops/compose
    schedule:
      interval: weekly
