databaseChangeLog:
  - changeSet:
      id: eventcatalog-001-create-events
      author: shiftcontrol
      changes:
        - createTable:
            tableName: eventcatalog_event
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: short_description
                  type: VARCHAR(255)
              - column:
                  name: long_description
                  type: VARCHAR(1024)
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: reward_points_redeem_url
                  type: VARCHAR(2048)
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - sql:
            sql: CREATE UNIQUE INDEX uk_eventcatalog_event_name_ci ON eventcatalog_event (lower(name))
            splitStatements: false
        - createIndex:
            tableName: eventcatalog_event
            indexName: idx_eventcatalog_event_end_time
            columns:
              - column:
                  name: end_time
        - createTable:
            tableName: eventcatalog_event_link
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: eventcatalog_event_link
            baseColumnNames: event_id
            constraintName: fk_eventcatalog_event_link_event
            referencedTableName: eventcatalog_event
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: eventcatalog_event_link
            columnNames: event_id, type, url
            constraintName: uk_eventcatalog_event_link
  - changeSet:
      id: eventcatalog-002-create-rooms
      author: shiftcontrol
      changes:
        - createTable:
            tableName: eventcatalog_room
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1024)
              - column:
                  name: url
                  type: VARCHAR(1024)
              - column:
                  name: read_only
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: eventcatalog_room
            baseColumnNames: event_id
            constraintName: fk_eventcatalog_room_event
            referencedTableName: eventcatalog_event
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: CREATE UNIQUE INDEX uk_eventcatalog_room_event_name_ci ON eventcatalog_room (event_id, lower(name))
            splitStatements: false
        - createIndex:
            tableName: eventcatalog_room
            indexName: idx_eventcatalog_room_event
            columns:
              - column:
                  name: event_id
  - changeSet:
      id: eventcatalog-003-create-sessions
      author: shiftcontrol
      changes:
        - createTable:
            tableName: eventcatalog_session
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: room_id
                  type: UUID
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1024)
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: read_only
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: eventcatalog_session
            baseColumnNames: event_id
            constraintName: fk_eventcatalog_session_event
            referencedTableName: eventcatalog_event
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: eventcatalog_session
            baseColumnNames: room_id
            constraintName: fk_eventcatalog_session_room
            referencedTableName: eventcatalog_room
            referencedColumnNames: id
            onDelete: SET NULL
        - sql:
            sql: CREATE UNIQUE INDEX uk_eventcatalog_session_event_name_ci ON eventcatalog_session (event_id, lower(name))
            splitStatements: false
        - createIndex:
            tableName: eventcatalog_session
            indexName: idx_eventcatalog_session_event_start
            columns:
              - column:
                  name: event_id
              - column:
                  name: start_time
