databaseChangeLog:
  - changeSet:
      id: shift-001-create-plans-memberships-roles-and-invites
      author: shiftcontrol
      changes:
        - createTable:
            tableName: shift_volunteer
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createTable:
            tableName: shift_plan
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: short_description
                  type: VARCHAR(255)
              - column:
                  name: long_description
                  type: VARCHAR(1024)
              - column:
                  name: default_staffing_mode
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: archived_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - sql:
            sql: CREATE UNIQUE INDEX uk_shift_plan_event_name_ci ON shift_plan (event_id, lower(name))
            splitStatements: false
        - createIndex:
            tableName: shift_plan
            indexName: idx_shift_plan_event
            columns:
              - column:
                  name: event_id
        - createTable:
            tableName: shift_plan_membership
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: planner
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: volunteer_changes_restricted
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_plan_membership
            baseColumnNames: plan_id
            constraintName: fk_shift_plan_membership_plan
            referencedTableName: shift_plan
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: shift_plan_membership
            columnNames: plan_id, user_id
            constraintName: uk_shift_plan_membership_user
        - createIndex:
            tableName: shift_plan_membership
            indexName: idx_shift_plan_membership_user
            columns:
              - column:
                  name: user_id
        - createTable:
            tableName: shift_plan_membership_role
            columns:
              - column:
                  name: membership_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: shift_plan_membership_role
            columnNames: membership_id, role_id
            constraintName: pk_shift_plan_membership_role
        - addForeignKeyConstraint:
            baseTableName: shift_plan_membership_role
            baseColumnNames: membership_id
            constraintName: fk_shift_plan_membership_role_membership
            referencedTableName: shift_plan_membership
            referencedColumnNames: id
            onDelete: CASCADE
        - createTable:
            tableName: shift_role
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1024)
              - column:
                  name: self_assignable
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_role
            baseColumnNames: plan_id
            constraintName: fk_shift_role_plan
            referencedTableName: shift_plan
            referencedColumnNames: id
        - sql:
            sql: CREATE UNIQUE INDEX uk_shift_role_plan_name_ci ON shift_role (plan_id, lower(name))
            splitStatements: false
        - createTable:
            tableName: shift_plan_invite
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: raw_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: use_limit
                  type: INTEGER
              - column:
                  name: uses
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_plan_invite
            baseColumnNames: plan_id
            constraintName: fk_shift_plan_invite_plan
            referencedTableName: shift_plan
            referencedColumnNames: id
        - sql:
            sql: ALTER TABLE shift_plan_invite ADD CONSTRAINT ck_shift_plan_invite_limit CHECK (use_limit IS NULL OR use_limit > 0)
            splitStatements: false
        - createIndex:
            tableName: shift_plan_invite
            indexName: idx_shift_plan_invite_plan
            columns:
              - column:
                  name: plan_id
        - createTable:
            tableName: shift_plan_invite_role
            columns:
              - column:
                  name: invite_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: shift_plan_invite_role
            columnNames: invite_id, role_id
            constraintName: pk_shift_plan_invite_role
        - addForeignKeyConstraint:
            baseTableName: shift_plan_invite_role
            baseColumnNames: invite_id
            constraintName: fk_shift_plan_invite_role_invite
            referencedTableName: shift_plan_invite
            referencedColumnNames: id
            onDelete: CASCADE
  - changeSet:
      id: shift-002-create-staffing-shifts-and-position-slots
      author: shiftcontrol
      changes:
        - createTable:
            tableName: shift_staffing_shift
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: short_description
                  type: VARCHAR(255)
              - column:
                  name: long_description
                  type: VARCHAR(1024)
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: location_id
                  type: UUID
              - column:
                  name: session_id
                  type: UUID
              - column:
                  name: staffing_mode_override
                  type: VARCHAR(32)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_staffing_shift
            baseColumnNames: plan_id
            constraintName: fk_shift_staffing_shift_plan
            referencedTableName: shift_plan
            referencedColumnNames: id
        - sql:
            sql: ALTER TABLE shift_staffing_shift ADD CONSTRAINT ck_shift_staffing_shift_time CHECK (end_time > start_time)
            splitStatements: false
        - sql:
            sql: ALTER TABLE shift_staffing_shift ADD CONSTRAINT ck_shift_staffing_shift_location_source CHECK (NOT (location_id IS NOT NULL AND session_id IS NOT NULL))
            splitStatements: false
        - createIndex:
            tableName: shift_staffing_shift
            indexName: idx_shift_staffing_shift_plan_start
            columns:
              - column:
                  name: plan_id
              - column:
                  name: start_time
        - createTable:
            tableName: shift_position_slot
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: staffing_shift_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1024)
              - column:
                  name: desired_volunteer_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: required_role_id
                  type: UUID
              - column:
                  name: skip_auto_assignment
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_position_slot
            baseColumnNames: staffing_shift_id
            constraintName: fk_shift_position_slot_staffing_shift
            referencedTableName: shift_staffing_shift
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: shift_position_slot
            baseColumnNames: required_role_id
            constraintName: fk_shift_position_slot_required_role
            referencedTableName: shift_role
            referencedColumnNames: id
            onDelete: SET NULL
        - sql:
            sql: ALTER TABLE shift_position_slot ADD CONSTRAINT ck_shift_position_slot_desired_count CHECK (desired_volunteer_count > 0)
            splitStatements: false
        - sql:
            sql: CREATE UNIQUE INDEX uk_shift_position_slot_name_ci ON shift_position_slot (staffing_shift_id, lower(name))
            splitStatements: false
  - changeSet:
      id: shift-003-create-availability-assignments-and-transition-history
      author: shiftcontrol
      changes:
        - createTable:
            tableName: shift_availability
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: VARCHAR(1024)
              - column:
                  name: created_by_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: authorized_override_reason
                  type: VARCHAR(1024)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE shift_availability ADD CONSTRAINT ck_shift_availability_time CHECK (end_time > start_time)
            splitStatements: false
        - createIndex:
            tableName: shift_availability
            indexName: idx_shift_availability_event_user_time
            columns:
              - column:
                  name: event_id
              - column:
                  name: user_id
              - column:
                  name: start_time
        - createTable:
            tableName: shift_assignment
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: position_slot_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: authorized_override_reason
                  type: VARCHAR(1024)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_assignment
            baseColumnNames: position_slot_id
            constraintName: fk_shift_assignment_position_slot
            referencedTableName: shift_position_slot
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: shift_assignment
            columnNames: position_slot_id, user_id
            constraintName: uk_shift_assignment_slot_user
        - createIndex:
            tableName: shift_assignment
            indexName: idx_shift_assignment_user_state
            columns:
              - column:
                  name: user_id
              - column:
                  name: state
        - createTable:
            tableName: shift_assignment_transition
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: assignment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: from_state
                  type: VARCHAR(32)
              - column:
                  name: to_state
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: actor_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1024)
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_assignment_transition
            baseColumnNames: assignment_id
            constraintName: fk_shift_assignment_transition_assignment
            referencedTableName: shift_assignment
            referencedColumnNames: id
        - createIndex:
            tableName: shift_assignment_transition
            indexName: idx_shift_assignment_transition_assignment_time
            columns:
              - column:
                  name: assignment_id
              - column:
                  name: occurred_at
        - createTable:
            tableName: shift_plan_mode_transition
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: actor_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: old_mode
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: new_mode
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: application_policy
                  type: VARCHAR(96)
                  constraints:
                    nullable: false
              - column:
                  name: resolved_join_request_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: resolved_leave_request_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shift_plan_mode_transition
            baseColumnNames: plan_id
            constraintName: fk_shift_plan_mode_transition_plan
            referencedTableName: shift_plan
            referencedColumnNames: id
        - createIndex:
            tableName: shift_plan_mode_transition
            indexName: idx_shift_plan_mode_transition_plan_time
            columns:
              - column:
                  name: plan_id
              - column:
                  name: occurred_at
  - changeSet:
      id: shift-004-restore-legacy-live-assignment-shape
      author: shiftcontrol
      changes:
        - renameTable:
            oldTableName: shift_staffing_shift
            newTableName: shift_shift
        - renameColumn:
            tableName: shift_position_slot
            oldColumnName: staffing_shift_id
            newColumnName: shift_id
            columnDataType: UUID
        - sql:
            sql: ALTER INDEX uk_shift_position_slot_name_ci RENAME TO uk_shift_position_slot_shift_name_ci
            splitStatements: false
        - renameTable:
            oldTableName: shift_availability
            newTableName: shift_time_constraint
        - addColumn:
            tableName: shift_time_constraint
            columns:
              - column:
                  name: type
                  type: VARCHAR(32)
        - update:
            tableName: shift_time_constraint
            columns:
              - column:
                  name: type
                  value: UNAVAILABLE
        - addNotNullConstraint:
            tableName: shift_time_constraint
            columnName: type
            columnDataType: VARCHAR(32)
        - dropColumn:
            tableName: shift_time_constraint
            columnName: created_by_user_id
        - dropColumn:
            tableName: shift_time_constraint
            columnName: authorized_override_reason
        - delete:
            tableName: shift_assignment
            where: state IN ('DECLINED', 'WITHDRAWN', 'UNASSIGNED')
        - update:
            tableName: shift_assignment
            columns:
              - column:
                  name: state
                  value: REQUEST_FOR_ASSIGNMENT
            where: state = 'JOIN_REQUESTED'
        - update:
            tableName: shift_assignment
            columns:
              - column:
                  name: state
                  value: AUCTION_REQUEST_FOR_UNASSIGN
            where: state = 'LEAVE_REQUESTED'
        - dropIndex:
            tableName: shift_assignment
            indexName: idx_shift_assignment_user_state
        - renameColumn:
            tableName: shift_assignment
            oldColumnName: state
            newColumnName: status
            columnDataType: VARCHAR(32)
        - dropColumn:
            tableName: shift_assignment
            columnName: authorized_override_reason
        - createIndex:
            tableName: shift_assignment
            indexName: idx_shift_assignment_user_status
            columns:
              - column:
                  name: user_id
              - column:
                  name: status
        - dropTable:
            tableName: shift_assignment_transition
        - dropTable:
            tableName: shift_plan_mode_transition
